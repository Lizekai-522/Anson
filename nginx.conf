# 爸妈出行宝 · nginx 静态托管
# 注意：应用用 hash 路由（#/home、#/e/<token>），路径部分永远只有 /，服务端
# 不需要 SPA rewrite 兜底规则；try_files 只是给静态文件做常规兜底。
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # 带内容哈希的构建产物可以长缓存
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # service worker 不能被缓存，否则新版本发不出去
    location = /sw.js {
        add_header Cache-Control "no-cache";
    }

    gzip on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml text/plain;
}